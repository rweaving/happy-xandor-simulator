<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HappyLogic × XAndOrCode — Digital Logic Simulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #side-bar::-webkit-scrollbar { width: 6px; }
    #side-bar::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.35); border-radius: 3px; }
    .palette-item {
      transition: transform 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
    }
    .palette-item:hover {
      transform: translateY(-1px);
    }
    .palette-item img {
      image-rendering: auto;
      max-height: 40px;
      width: auto;
      object-fit: contain;
    }
    .toolbar-btn {
      transition: background-color 0.12s ease, opacity 0.12s ease, transform 0.08s ease;
    }
    .toolbar-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] flex flex-col h-screen w-screen overflow-hidden">

  <!-- Top Toolbar (XAndOrCode + HappyLogicSimulator Controls) -->
  <header id="top-bar" class="h-12 shrink-0 bg-[#14005b] text-white border-b border-black/40 px-3 flex items-center justify-between gap-2 z-20 shadow-md">
    <div class="flex items-center gap-2 min-w-0">
      <div class="flex items-center gap-2 pr-2 border-r border-white/15">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00fc00] shadow-[0_0_8px_#00fc00]" id="sim-indicator"></span>
        <h1 class="font-bold text-sm tracking-tight whitespace-nowrap text-white">
          XAndOrCode <span class="text-[#f3ee00] font-normal text-xs">× HappyLogic</span>
        </h1>
      </div>

      <!-- Preset & Saved Circuit Selector -->
      <label class="text-xs text-white/80 hidden sm:inline" for="select_circuit">Circuit:</label>
      <select id="select_circuit" class="bg-[#2c009d] text-[#f3ee00] text-xs font-medium rounded px-2.5 py-1.5 border border-black/60 focus:outline-none focus:ring-1 focus:ring-[#f3ee00] cursor-pointer">
        <optgroup label="Combined Presets">
          <option value="default">Default — Interactive Gate &amp; Flip-Flop Showcase</option>
          <option value="adderTest">adderTest — 4-Bit Ripple Carry Adder (XAndOrCode)</option>
          <option value="Tff">Tff — Discrete 8-NAND Toggle Flip-Flop (HappyLogic)</option>
          <option value="CounterTest">CounterTest — 12-Bit Ripple Counter (HappyLogic)</option>
          <option value="jkff">jkff — JK &amp; Clocked RS Flip-Flop Lab (XAndOrCode)</option>
          <option value="makeySoundDemo">makeySoundDemo — MaKey MaKey + ArrowPad + 4-Bit Synth</option>
          <option value="And3">And3 — 3-Input AND Gate (HappyLogic)</option>
          <option value="And4">And4 — 4-Input AND Tree (HappyLogic)</option>
          <option value="Not">Not — Inverter Demo (HappyLogic)</option>
        </optgroup>
        <optgroup label="User Saved Circuits" id="user_circuits_optgroup"></optgroup>
      </select>

      <button id="btn_run_pause" class="toolbar-btn bg-[#2c009d] hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-medium px-2.5 py-1.5 rounded border border-black/60 flex items-center gap-1" title="Pause or Resume 100Hz Simulation">
        <span id="run_pause_label">Pause</span>
      </button>
      <button id="btn_step" class="toolbar-btn bg-[#2c009d] hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-medium px-2 py-1.5 rounded border border-black/60" title="Execute Single Simulation Tick">
        Step
      </button>

      <label class="flex items-center gap-1.5 bg-[#2c009d] text-[#f3ee00] text-xs font-medium px-2.5 py-1.5 rounded border border-black/60 cursor-pointer whitespace-nowrap">
        <input type="checkbox" id="checkbox_gridsnap" class="accent-[#f3ee00] cursor-pointer" />
        <span>Grid Snap</span>
      </label>
    </div>

    <!-- Right Actions: Create Device, Save/Export, Zoom, Telemetry -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn_save_circuit" class="toolbar-btn bg-[#2c009d] hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-medium px-2.5 py-1.5 rounded border border-black/60" title="Save circuit to browser storage">
        Save Circuit
      </button>
      <button id="btn_save_device" class="toolbar-btn bg-[#2c009d] hover:bg-[#4f4cff] text-[#00fc00] text-xs font-medium px-2.5 py-1.5 rounded border border-black/60" title="Compile current circuit of INPUTs and OUTPUTs into a reusable custom IC chip">
        + Make IC Chip
      </button>
      <button id="btn_export_json" class="toolbar-btn bg-[#2c009d] hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-medium px-2 py-1.5 rounded border border-black/60" title="Export or Import Circuit JSON">
        JSON
      </button>
      <button id="btn_clear" class="toolbar-btn bg-red-900/80 hover:bg-red-700 text-white text-xs font-medium px-2 py-1.5 rounded border border-black/60" title="Clear all devices and wires">
        Clear
      </button>

      <div class="flex items-center bg-[#2c009d] rounded border border-black/60 overflow-hidden ml-1">
        <button id="button_zoomOut" class="toolbar-btn hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-bold px-2 py-1.5" title="Zoom Out">−</button>
        <button id="button_zoomReset" class="toolbar-btn hover:bg-[#4f4cff] text-white text-xs px-2 py-1.5 border-x border-black/40" title="Reset Zoom (100%)">100%</button>
        <button id="button_zoomIn" class="toolbar-btn hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-bold px-2 py-1.5" title="Zoom In">+</button>
      </div>

      <div id="perf_badge" class="hidden lg:flex flex-col items-end text-xs leading-tight pl-2 text-white/80 font-mono">
        <span id="stat_calc">0.0 μs/tick</span>
        <span id="stat_wire" class="text-[#00fc00]">0 dev · 0 wire</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace: Left Sidebar Palette + Right Interactive Canvas -->
  <div class="flex flex-1 min-h-0 relative overflow-hidden">
    <!-- Left Device Selector Bar (#side-bar) -->
    <aside id="side-bar" class="w-40 shrink-0 bg-[#ececec] text-slate-900 border-r-2 border-[#6c6c6c] shadow-[3px_3px_15px_3px_rgba(0,0,0,0.25)] overflow-y-auto z-10 p-2 flex flex-col gap-2">
      <div class="text-xs font-bold uppercase tracking-wider text-[#14005b] px-1 pt-0.5">
        Click to Add Device
      </div>
      <div id="palette_container" class="flex flex-col gap-2"></div>
    </aside>

    <!-- Main Simulation Canvas Container -->
    <main class="flex-1 relative bg-[#eeeeee] overflow-hidden" id="canvas-wrap">
      <canvas id="canvas" width="1000" height="600" class="block cursor-default"></canvas>

      <!-- Floating Helper Bar at Bottom-Left of Canvas -->
      <div id="status_banner" class="absolute bottom-3 left-3 bg-[#14005b]/90 text-white text-xs px-3 py-1.5 rounded-lg shadow-lg border border-white/15 flex items-center gap-3 pointer-events-none">
        <span id="status_hint"><b>Click</b> INPUT/SWITCH to toggle · <b>Click pin</b> to route wire · <b>Right-click</b> device for menu · <b>Del</b> to remove</span>
      </div>

      <!-- Sublogic / JSON Modal Overlay -->
      <div id="modal_overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white text-slate-900 rounded-xl shadow-2xl border border-slate-300 max-w-lg w-full p-5 flex flex-col gap-3 max-h-[85vh]">
          <div class="flex items-center justify-between border-b border-slate-200 pb-2">
            <h2 id="modal_title" class="font-bold text-base text-[#14005b]">Modal Title</h2>
            <button id="modal_close" class="text-slate-500 hover:text-slate-900 text-sm font-bold px-2 py-0.5 rounded">✕</button>
          </div>
          <div id="modal_body" class="text-xs text-slate-700 overflow-y-auto space-y-2 flex-1"></div>
          <div id="modal_footer" class="flex justify-end gap-2 pt-2 border-t border-slate-200"></div>
        </div>
      </div>
    </main>
  </div>

    function resolveAssetUrl(path) {
      if (!path) return '';
      if (EMBEDDED_ASSETS[path]) return EMBEDDED_ASSETS[path];
      return path;
    }

    // =========================================================================
    // 2. CORE LOGIC GATES (lib/logic.dart — Fixed pXnor & pNot constructors + OUTPUT_DELAY)
    // =========================================================================
    const OUTPUT_DELAY = 3;

    class Logic {
      constructor(name = 'logic') {
        this.name = name;
        this.duration = 50;
        this.delay = 50;
        this.ticks = 0;
        this.calculated = false;
        this.ig1 = -1;
        this.ig2 = -1;
        this.in1 = false;
        this.in2 = false;
        this.out = false;
        this.inGate1 = null;
        this.inGate2 = null;
      }

      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
      }

      setOut(outVal) {
        if (this.out === outVal) return;
        if (outVal) {
          this.ticks++;
          if (this.ticks >= OUTPUT_DELAY) {
            this.ticks = OUTPUT_DELAY;
            this.out = true;
          }
          return;
        }
        this.ticks = 0;
        this.out = false;
      }
    }

    class pIn extends Logic {
      constructor() { super('input'); }
      calc() { this.calculated = true; }
    }
    class pOut extends Logic {
      constructor() { super('output'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        this.setOut(Boolean(this.inGate1 && this.inGate1.out));
      }
    }
    class pAnd extends Logic {
      constructor() { super('and'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(Boolean(this.inGate1 && this.inGate1.out && this.inGate2 && this.inGate2.out));
      }
    }
    class pNand extends Logic {
      constructor() { super('nand'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(!(Boolean(this.inGate1 && this.inGate1.out && this.inGate2 && this.inGate2.out)));
      }
    }
    class pOr extends Logic {
      constructor() { super('or'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(Boolean((this.inGate1 && this.inGate1.out) || (this.inGate2 && this.inGate2.out)));
      }
    }
    class pNor extends Logic {
      constructor() { super('nor'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(!Boolean((this.inGate1 && this.inGate1.out) || (this.inGate2 && this.inGate2.out)));
      }
    }
    class pXor extends Logic {
      constructor() { super('xor'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(Boolean(this.inGate1 && this.inGate1.out) !== Boolean(this.inGate2 && this.inGate2.out));
      }
    }
    class pXnor extends Logic {
      constructor() { super('xnor'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        if (this.inGate2 && !this.inGate2.calculated) this.inGate2.calc();
        this.setOut(Boolean(this.inGate1 && this.inGate1.out) === Boolean(this.inGate2 && this.inGate2.out));
      }
    }
    class pNot extends Logic {
      constructor() { super('not'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        this.setOut(!Boolean(this.inGate1 && this.inGate1.out));
      }
    }
    class pBuffer extends Logic {
      constructor() { super('buffer'); }
      calc() {
        this.calculated = true;
        if (this.inGate1 && !this.inGate1.calculated) this.inGate1.calc();
        this.setOut(Boolean(this.inGate1 && this.inGate1.out));
      }
    }
    class pSwitch extends Logic {
      constructor() { super('switch'); }
      calc() {
        this.calculated = true;
        this.setOut(this.in1);
      }
    }
    class pClock extends Logic {
      constructor() { super('clock'); }
      calc() {
        this.calculated = true;
        this.ticks++;
        if (this.out && this.ticks > this.duration) {
          this.out = false;
          this.ticks = 0;
          return;
        }
        if (!this.out && this.ticks > this.delay) {
          this.out = true;
          this.ticks = 0;
        }
      }
    }

    // =========================================================================
    // 3. IMAGES, PINS, & DEVICE TYPES (lib/device_types.dart + lib/device_map.dart)
    // =========================================================================
    class OffsetImage {
      constructor(imageSrc, offsetLeft = 0, offsetTop = 0) {
        this.rawPath = imageSrc;
        this.offsetPoint = { x: offsetLeft, y: offsetTop };
        this.image = new Image();
        this.image.src = resolveAssetUrl(imageSrc);
      }
    }

    class ImageMap {
      constructor(id, lowSrc, highSrc, offsetX = 0, offsetY = 0) {
        this.id = id;
        this.lowImage = lowSrc ? new OffsetImage(lowSrc, offsetX, offsetY) : null;
        this.highImage = highSrc ? new OffsetImage(highSrc, offsetX, offsetY) : null;
      }
    }

    class SubLogicGate {
      constructor(gateType, connection1, connection2) {
        this.gateType = gateType.toLowerCase();
        this.connection1 = connection1;
        this.connection2 = connection2;
      }
    }

    class OutputMap {
      constructor(id, type, value) {
        this.id = id;
        this.type = type.toLowerCase();
        this.value = value;
      }
    }

    class InputMap {
      constructor(id, type, value) {
        this.id = id;
        this.type = type.toLowerCase();
        this.value = value;
      }
    }

    class LogicDeviceType {
      constructor(type, category = 'Gates', displayName = null) {
        this.type = type.toLowerCase();
        this.category = category;
        this.displayName = displayName || type.toUpperCase();
        this.updatable = false;
        this.hasOutputMaps = false;
        this.hasInputMaps = false;
        this.subLogicGates = [];
        this.outputMaps = [];
        this.inputMaps = [];
        this.inputImages = [];
        this.outputImages = [];
        this.inputPoint = {};
        this.outputPoint = {};
        this.inputLabels = {};
        this.outputLabels = {};
        this.baseImage = null;
        this.iconImage = null;
        this.selectedImage = null;
      }

      get centerPoint() {
        const w = (this.baseImage && this.baseImage.image.width) ? this.baseImage.image.width : 85;
        const h = (this.baseImage && this.baseImage.image.height) ? this.baseImage.image.height : 45;
        return { x: -w / 2, y: -h / 2 };
      }

      addInput(id, x, y, label = '') {
        this.inputPoint[id] = { x, y };
        if (label) this.inputLabels[id] = label;
        return this;
      }
      addOutput(id, x, y, label = '') {
        this.outputPoint[id] = { x, y };
        if (label) this.outputLabels[id] = label;
        return this;
      }
      mapOutput(id, type, value) {
        this.outputMaps.push(new OutputMap(id, type, value));
        this.hasOutputMaps = true;
        return this;
      }
      mapInput(id, type, value) {
        this.inputMaps.push(new InputMap(id, type, value));
        this.hasInputMaps = true;
        return this;
      }
      addInputImage(id, low, high, ox = 0, oy = 0) {
        this.inputImages.push(new ImageMap(id, low, high, ox, oy));
        this.updatable = true;
        return this;
      }
      addOutputImage(id, low, high, ox = 0, oy = 0) {
        this.outputImages.push(new ImageMap(id, low, high, ox, oy));
        this.updatable = true;
        return this;
      }
      addSubLogicGate(type, c1, c2) {
        this.subLogicGates.push(new SubLogicGate(type, c1, c2));
        return this;
      }
      setBaseImage(src) { this.baseImage = new OffsetImage(src, 0, 0); return this; }
      setIconImage(src) { this.iconImage = new OffsetImage(src, 0, 0); return this; }
      setSelectedImage(src) { this.selectedImage = new OffsetImage(src, 0, 0); return this; }
    }

    // =========================================================================
    // 4. DEVICE I/O & LOGIC DEVICE INSTANCE (lib/device_input.dart, lib/device_output.dart, lib/logic_device.dart)
    // =========================================================================
    const IO_HIT_RADIUS = 9;

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    class DeviceInput {
      constructor(device, id) {
        this.device = device;
        this.id = Number(id);
        this.subLogicGate = null;
        this.imageMap = null;
        this.inputMap = null;
        this.connectable = true;
        this.triggered = false;
        this.updated = false;
        this.previous_value = false;
        this.connectedWire = null;
        const pt = device.deviceType.inputPoint[this.id];
        if (pt && pt.x < 0) this.connectable = false;
      }

      get offset() {
        const pt = this.device.deviceType.inputPoint[this.id] || { x: 0, y: 0 };
        return { x: pt.x + this.device.position.x, y: pt.y + this.device.position.y };
      }

      get mappedImage() {
        if (!this.imageMap) return null;
        return this.value ? this.imageMap.highImage : this.imageMap.lowImage;
      }

      pinHit(p) {
        return dist(p, this.offset) <= IO_HIT_RADIUS;
      }

      checkUpdate() {
        if (this.connectedWire && this.connectedWire.output) {
          this.updated = this.connectedWire.output.updated;
        } else {
          this.updated = false;
        }
      }

      get connected() {
        return Boolean(this.connectedWire && this.connectedWire.output);
      }

      get value() {
        if (!this.connectedWire || !this.connectedWire.output) return false;
        if (!this.connectedWire.output.calculated) {
          this.connectedWire.output.calculate();
        }
        return this.connectedWire.output.value;
      }
    }

    class DeviceOutput {
      constructor(device, id) {
        this.device = device;
        this.id = Number(id);
        this.subLogicGate = null;
        this.outputMap = null;
        this.imageMap = null;
        this.value = false;
        this.previous_value = false;
        this.connectable = true;
        const pt = device.deviceType.outputPoint[this.id];
        if (pt && pt.x < 0) this.connectable = false;
      }

      get updated() {
        return this.value !== this.previous_value;
      }

      get mappedImage() {
        if (!this.imageMap) return null;
        return this.value ? this.imageMap.highImage : this.imageMap.lowImage;
      }

      get offset() {
        const pt = this.device.deviceType.outputPoint[this.id] || { x: 0, y: 0 };
        return { x: pt.x + this.device.position.x, y: pt.y + this.device.position.y };
      }

      pinHit(p) {
        return dist(p, this.offset) <= IO_HIT_RADIUS;
      }

      get calculated() {
        return this.device.calculated;
      }

      calculate() {
        this.device.calculate();
      }
    }

    class LogicDevice {
      constructor(deviceType, key) {
        this.deviceType = deviceType;
        this.key = String(key);
        this.position = { x: 0, y: 0 };
        this.selectable = true;
        this.calculated = false;
        this.updated = false;
        this.hasOutputMaps = false;
        this.hasInputMaps = false;
        this._locked = false;
        this.label = null;
        this.inputs = [];
        this.outputs = [];
        this.subLogic = [];
        this.images = [];

        for (const id of Object.keys(deviceType.inputPoint)) {
          this.inputs.push(new DeviceInput(this, Number(id)));
        }
        for (const id of Object.keys(deviceType.outputPoint)) {
          this.outputs.push(new DeviceOutput(this, Number(id)));
        }
        for (const outImg of deviceType.outputImages) {
          const out = this.outputs.find(o => o.id === outImg.id);
          if (out) out.imageMap = outImg;
        }
        for (const inImg of deviceType.inputImages) {
          const inp = this.inputs.find(i => i.id === inImg.id);
          if (inp) inp.imageMap = inImg;
        }
        for (const outMap of deviceType.outputMaps) {
          const out = this.outputs.find(o => o.id === outMap.id);
          if (out) {
            out.outputMap = outMap;
            this.hasOutputMaps = true;
          }
        }
        for (const inMap of deviceType.inputMaps) {
          const inp = this.inputs.find(i => i.id === inMap.id);
          if (inp) {
            inp.inputMap = inMap;
            this.hasInputMaps = true;
          }
        }

        this.loadSublogic();
        this.buildImageList();
      }

      get locked() { return this._locked; }
      set locked(val) { this._locked = Boolean(val); }

      buildImageList() {
        this.images.length = 0;
        if (this.deviceType.baseImage) {
          this.images.push(this.deviceType.baseImage);
        }
        for (const input of this.inputs) {
          if (input.mappedImage) this.images.push(input.mappedImage);
        }
        for (const output of this.outputs) {
          if (output.mappedImage) this.images.push(output.mappedImage);
        }
      }

      checkSoundEvents() {
        if (!this.hasInputMaps) return;
        for (const input of this.inputs) {
          if (input.inputMap && input.inputMap.type === 'sound') {
            if (input.value) {
              if (!input.triggered) {
                input.triggered = true;
                playSimulatorSound(input.inputMap.value, input.id);
              }
            } else {
              input.triggered = false;
            }
          }
        }
      }

      InputPinHit(p) {
        for (const input of this.inputs) {
          if (input.connectable && input.pinHit(p)) return input;
        }
        return null;
      }

      OutputPinHit(p) {
        for (const output of this.outputs) {
          if (output.connectable && output.pinHit(p)) return output;
        }
        return null;
      }

      moveDevice(p) {
        this.position = { x: Math.round(p.x), y: Math.round(p.y) };
        for (const wire of wires) {
          for (const input of this.inputs) {
            if (wire.input === input) wire.adjustInputWirePoint();
          }
          for (const output of this.outputs) {
            if (wire.output === output) wire.adjustOutputWirePoint();
          }
        }
      }

      clicked(clickPoint) {
        if (this.outputs.length === 0) return;
        const t = this.deviceType.type;
        if (t === 'input' || t === 'switch') {
          this.outputs[0].value = !this.outputs[0].value;
          this.updated = true;
        } else if (t === 'arrowpad' && clickPoint) {
          const rx = clickPoint.x - this.position.x;
          const ry = clickPoint.y - this.position.y;
          if (rx < 68 && ry > 55 && ry < 128) this.outputs[0].value = !this.outputs[0].value;
          else if (rx > 112 && ry > 55 && ry < 128) this.outputs[1].value = !this.outputs[1].value;
          else if (ry < 68 && rx > 55 && rx < 128) this.outputs[2].value = !this.outputs[2].value;
          else if (ry > 112 && rx > 55 && rx < 128) this.outputs[3].value = !this.outputs[3].value;
          this.updated = true;
        } else if (t === 'makey' && clickPoint) {
          // Allow clicking directly near any MaKey MaKey pad area to toggle its output
          const rx = clickPoint.x - this.position.x;
          const ry = clickPoint.y - this.position.y;
          if (rx >= 15 && rx <= 75 && ry >= 55 && ry <= 105) this.outputs[0].value = !this.outputs[0].value; // Left
          else if (rx >= 135 && rx <= 195 && ry >= 55 && ry <= 105) this.outputs[1].value = !this.outputs[1].value; // Right
          else if (rx >= 75 && rx <= 135 && ry >= 10 && ry <= 60) this.outputs[2].value = !this.outputs[2].value; // Up
          else if (rx >= 75 && rx <= 135 && ry >= 95 && ry <= 150) this.outputs[3].value = !this.outputs[3].value; // Down
          else if (rx >= 205 && rx <= 275 && ry >= 35 && ry <= 115) this.outputs[4].value = !this.outputs[4].value; // Space
          else if (rx >= 280 && rx <= 355 && ry >= 35 && ry <= 115) this.outputs[5].value = !this.outputs[5].value; // Click
          this.updated = true;
        }
        this.buildImageList();
      }

      setClock(delay, duration) {
        const d = Math.max(5, Number(delay) || 50);
        const dur = Math.max(5, Number(duration) || 50);
        for (const logic of this.subLogic) {
          logic.delay = d;
          logic.duration = dur;
        }
      }

      getClock() {
        for (const logic of this.subLogic) {
          if (logic.name === 'clock') return { delay: logic.delay, duration: logic.duration };
        }
        return { delay: 50, duration: 50 };
      }

      setState(value) {
        if (this.outputs.length === 0) return;
        if (this.deviceType.type === 'input' || this.deviceType.type === 'switch') {
          this.outputs[0].value = Boolean(value);
          this.updated = true;
          this.buildImageList();
        }
      }

      keyDown(keyCode) {
        let changed = false;
        for (const output of this.outputs) {
          if (output.outputMap && output.outputMap.type === 'key' && Number(output.outputMap.value) === keyCode) {
            if (!output.value) {
              output.value = true;
              changed = true;
            }
          }
        }
        if (changed) this.buildImageList();
      }

      keyUp(keyCode) {
        let changed = false;
        for (const output of this.outputs) {
          if (output.outputMap && output.outputMap.type === 'key' && Number(output.outputMap.value) === keyCode) {
            if (output.value) {
              output.value = false;
              changed = true;
            }
          }
        }
        if (changed) this.buildImageList();
      }

      width() {
        const img = this.deviceType.baseImage && this.deviceType.baseImage.image;
        return (img && img.width > 0) ? img.width : 93;
      }

      height() {
        const img = this.deviceType.baseImage && this.deviceType.baseImage.image;
        return (img && img.height > 0) ? img.height : 48;
      }

      contains(p) {
        const w = this.width();
        const h = this.height();
        return p.x > this.position.x && p.x < this.position.x + w &&
               p.y > this.position.y && p.y < this.position.y + h;
      }

      calculate() {
        if (this.calculated) return;
        this.calculated = true;
        this.updated = false;

        for (const input of this.inputs) input.updated = false;
        for (const output of this.outputs) output.previous_value = output.value;

        this.subCalc();
        this.checkSoundEvents();

        for (const input of this.inputs) {
          input.checkUpdate();
          if (input.updated) {
            this.updated = true;
            break;
          }
        }
        for (const output of this.outputs) {
          if (output.previous_value !== output.value) {
            this.updated = true;
            break;
          }
        }
        if (this.updated && this.deviceType.updatable) {
          this.buildImageList();
        }
      }

      subCalc() {
        if (this.subLogic.length === 0) return;
        for (const gate of this.subLogic) gate.calculated = false;
        for (const input of this.inputs) {
          if (input.subLogicGate) input.subLogicGate.out = input.value;
        }
        for (const gate of this.subLogic) gate.calc();
        for (const output of this.outputs) {
          if (output.subLogicGate) output.value = output.subLogicGate.out;
        }
      }

      setConnections() {
        for (const sl of this.subLogic) {
          if (sl.ig1 >= 0 && sl.ig1 < this.subLogic.length) sl.inGate1 = this.subLogic[sl.ig1];
          if (sl.ig2 >= 0 && sl.ig2 < this.subLogic.length) sl.inGate2 = this.subLogic[sl.ig2];
        }
      }

      addGate(gateType, inGate1, inGate2) {
        let newGate = null;
        switch (gateType.toLowerCase()) {
          case 'input':
          case 'in': newGate = new pIn(); break;
          case 'output':
          case 'out': newGate = new pOut(); break;
          case 'and': newGate = new pAnd(); break;
          case 'nand': newGate = new pNand(); break;
          case 'or': newGate = new pOr(); break;
          case 'nor': newGate = new pNor(); break;
          case 'xor': newGate = new pXor(); break;
          case 'xnor': newGate = new pXnor(); break;
          case 'not': newGate = new pNot(); break;
          case 'buffer': newGate = new pBuffer(); break;
          case 'switch': newGate = new pSwitch(); break;
          case 'clock': newGate = new pClock(); break;
        }
        if (newGate) {
          newGate.ig1 = inGate1;
          newGate.ig2 = inGate2;
          newGate.inGate1 = newGate;
          newGate.inGate2 = newGate;
          newGate.out = false;
          this.subLogic.push(newGate);
        }
        return newGate;
      }

      loadSublogic() {
        this.subLogic.length = 0;
        for (const gate of this.deviceType.subLogicGates) {
          if (gate.gateType === 'input' || gate.gateType === 'in') {
            if (gate.connection2 >= 0 && gate.connection2 < this.inputs.length) {
              this.inputs[gate.connection2].subLogicGate = this.addGate('input', -1, -1);
            }
            continue;
          }
          if (gate.gateType === 'output' || gate.gateType === 'out') {
            if (gate.connection2 >= 0 && gate.connection2 < this.outputs.length) {
              this.outputs[gate.connection2].subLogicGate = this.addGate('output', gate.connection1, -1);
            }
            continue;
          }
          this.addGate(gate.gateType, gate.connection1, gate.connection2);
        }
        this.setConnections();
      }
    }

    // =========================================================================
    // 5. WIRES, WIREGROUPS, & KNOTS (lib/wire.dart, lib/circuit_wires.dart, lib/wire_creator.dart)
    // =========================================================================
    const WIRE_HIT_RADIUS = 2.5;
    const WIREPOINT_HIT_RADIUS = 10;

    function samePt(a, b) {
      return a && b && Math.abs(a.x - b.x) < 1 && Math.abs(a.y - b.y) < 1;
    }

    class WireGroup {
      constructor(wire) {
        this.wires = [wire];
        this.connectedOutput = wire.output;
        wire.group = this;
      }

      addWire(newWire) {
        newWire.group = this;
        let inserted = false;
        for (let i = 0; i < this.wires.length; i++) {
          if (newWire.wirePoints.length <= this.wires[i].wirePoints.length) {
            this.wires.splice(i, 0, newWire);
            inserted = true;
            break;
          }
        }
        if (!inserted) this.wires.push(newWire);
        this.findKnots();
      }

      hasWire(wire) {
        return this.wires.includes(wire);
      }

      removeWire(wire) {
        const idx = this.wires.indexOf(wire);
        if (idx >= 0) this.wires.splice(idx, 1);
        this.findKnots();
      }

      findKnots() {
        const count = this.wires.length;
        if (count < 1) return;
        for (const w of this.wires) {
          if (!w.explicitKnot) w.wireKnot = null;
        }
        for (let t = 0; t < count - 1; t++) {
          const w1 = this.wires[t];
          for (const p1 of w1.wirePoints) {
            for (let x = t + 1; x < count; x++) {
              const w2 = this.wires[x];
              if (w2.wirePoints.length > 2) {
                for (let k = 1; k < w2.wirePoints.length - 1; k++) {
                  const p2 = w2.wirePoints[k];
                  if (samePt(p1, p2)) {
                    w1.wireKnot = { x: p2.x, y: p2.y };
                    break;
                  }
                }
              }
              if (w1.wireKnot) break;
            }
            if (w1.wireKnot) break;
          }
        }
      }
    }

    class Wire {
      constructor() {
        this.id = null;
        this.input = null;
        this.output = null;
        this.group = null;
        this.wireKnot = null;
        this.explicitKnot = false;
        this.wirePoints = [];
        this.valid = false;
      }

      toMap() {
        const midPoints = [];
        if (this.wirePoints.length > 2) {
          for (let i = 1; i < this.wirePoints.length - 1; i++) {
            midPoints.push({ x: Math.round(this.wirePoints[i].x), y: Math.round(this.wirePoints[i].y) });
          }
        }
        return {
          input: this.input ? this.input.device.key : null,
          inputPin: this.input ? this.input.id : 0,
          output: this.output ? this.output.device.key : null,
          outputPin: this.output ? this.output.id : 0,
          points: midPoints,
          knot: this.wireKnot ? { x: this.wireKnot.x, y: this.wireKnot.y } : null
        };
      }

      getWireSnapPoint(p) {
        const wp1 = this.contains(p);
        if (wp1) {
          const i = this.wirePoints.indexOf(wp1);
          if (i >= 0 && i + 1 < this.wirePoints.length) {
            const wp2 = this.wirePoints[i + 1];
            const length = dist(p, wp1);
            const angle = Math.atan2(wp2.y - wp1.y, wp2.x - wp1.x);
            return {
              x: Math.floor(length * Math.cos(angle) + wp1.x),
              y: Math.floor(length * Math.sin(angle) + wp1.y)
            };
          }
        }
        return null;
      }

      getWirePoint(p) {
        if (this.wirePoints.length <= 2) return null;
        for (let i = 1; i < this.wirePoints.length - 1; i++) {
          if (dist(p, this.wirePoints[i]) <= WIREPOINT_HIT_RADIUS) {
            return this.wirePoints[i];
          }
        }
        return null;
      }

      updateWirePoints(pointsList) {
        this.wirePoints.length = 0;
        if (this.input) this.wirePoints.push({ ...this.input.offset });
        for (const wp of (pointsList || [])) {
          this.wirePoints.push({ x: Number(wp.x), y: Number(wp.y) });
          if (wp.k) {
            this.wireKnot = { x: Number(wp.x), y: Number(wp.y) };
            this.explicitKnot = true;
          }
        }
        if (this.output) this.wirePoints.push({ ...this.output.offset });
        if (this.group) this.group.findKnots();
      }

      adjustInputWirePoint() {
        if (this.wirePoints.length > 0 && this.input) {
          this.wirePoints[0] = { ...this.input.offset };
        }
      }

      adjustOutputWirePoint() {
        if (this.wirePoints.length > 0 && this.output) {
          this.wirePoints[this.wirePoints.length - 1] = { ...this.output.offset };
        }
      }

      getSegment(p) {
        const wp1 = this.contains(p);
        if (!wp1) return null;
        const wpi1 = this.wirePoints.indexOf(wp1);
        if (wpi1 >= 0 && wpi1 + 1 < this.wirePoints.length) {
          return { inputSide: this.wirePoints[wpi1 + 1], outputSide: wp1 };
        }
        return null;
      }

      insertPoint(ws, p) {
        if (!ws || !p) return null;
        const wi = this.wirePoints.indexOf(ws.inputSide);
        if (wi < 0) return null;
        const endWire = this.wirePoints.slice(wi, this.wirePoints.length - 1).map(pt => ({ x: pt.x, y: pt.y }));
        const wp = { x: Math.floor(p.x), y: Math.floor(p.y) };
        this.wirePoints.splice(wi, 0, wp);
        return endWire;
      }

      getWireEnd(p) {
        const idx = this.wirePoints.indexOf(p);
        if (idx < 0) return [];
        return this.wirePoints.slice(idx, this.wirePoints.length - 1).map(pt => ({ x: pt.x, y: pt.y }));
      }

      contains(p) {
        if (this.wirePoints.length >= 2) {
          for (let t = 0; t < this.wirePoints.length - 1; t++) {
            const p1 = this.wirePoints[t];
            const p2 = this.wirePoints[t + 1];
            const d = dist(p, p1) + dist(p, p2) - dist(p2, p1);
            if (d <= WIRE_HIT_RADIUS) return p1;
          }
        }
        return null;
      }

      get strokeStyle() {
        if (!this.valid) return '#999999';
        return (this.output && this.output.value) ? '#ff4444' : '#101010';
      }
    }

    // Audio Synthesizer & Sample Player (supports both embedded WAV/OGG and WebAudio fallback)
    let audioCtx = null;
    function playSimulatorSound(soundPath, channelIndex = 0) {
      const dataUrl = resolveAssetUrl(soundPath);
      if (dataUrl && dataUrl.startsWith('data:audio')) {
        const audio = new Audio(dataUrl);
        audio.volume = 0.65;
        if (channelIndex === 2) audio.playbackRate = 1.35;
        audio.play().catch(() => {});
        return;
      }
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const freqs = [1000, 523.25, 659.25, 880];
        osc.frequency.value = freqs[channelIndex % freqs.length];
        osc.type = channelIndex === 3 ? 'triangle' : 'sine';
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch (_) {}
    }

      const twoInputGates = [

    // =========================================================================
    // 8. WIRES MANAGER & WIRE CREATOR
    // =========================================================================
    const circuitWires = {
      clearAll() {
        for (const w of wires) {
          if (w.input) w.input.connectedWire = null;
        }
        wires.length = 0;
        for (const k of Object.keys(wiresMap)) delete wiresMap[k];
        selectedWires.length = 0;
        selectedWirePoints.length = 0;
        wireGroups.length = 0;
      },

      addWireFromMap(map) {
        const newWire = new Wire();
        const inDev = logicDevicesMap[String(map.input)];
        const outDev = logicDevicesMap[String(map.output)];
        if (!inDev || !outDev) return null;

        const inPin = Number(map.inputPin);
        const outPin = Number(map.outputPin);

        const inp = inDev.inputs.find(i => i.id === inPin) || inDev.inputs[inPin] || inDev.inputs[0];
        const outp = outDev.outputs.find(o => o.id === outPin) || outDev.outputs[outPin] || outDev.outputs[0];
        if (!inp || !outp) return null;

        newWire.input = inp;
        inp.connectedWire = newWire;
        newWire.output = outp;

        const pts = Array.isArray(map.points) ? map.points : JSON.parse(map.points || '[]');
        newWire.updateWirePoints(pts);
        if (map.knot) {
          newWire.wireKnot = { x: Number(map.knot.x), y: Number(map.knot.y) };
          newWire.explicitKnot = true;
        }
        newWire.valid = true;
        newWire.id = 'w_' + (++nextIdCounter);
        wires.push(newWire);
        wiresMap[newWire.id] = newWire;
        this.addWireToGroup(newWire);
        return newWire;
      },

      addWireToGroup(wire) {
        for (const grp of wireGroups) {
          if (wire.output === grp.connectedOutput) {
            grp.addWire(wire);
            return;
          }
        }
        wireGroups.push(new WireGroup(wire));
      },

      removeWireFromGroup(wire) {
        for (let i = 0; i < wireGroups.length; i++) {
          const grp = wireGroups[i];
          if (grp.hasWire(wire)) {
            grp.removeWire(wire);
            if (grp.wires.length === 0) wireGroups.splice(i, 1);
            break;
          }
        }
      },

      removeWire(w) {
        if (w.input && w.input.connectedWire === w) w.input.connectedWire = null;
        const idx = wires.indexOf(w);
        if (idx >= 0) wires.splice(idx, 1);
        if (w.id) delete wiresMap[w.id];
        this.removeWireFromGroup(w);
      },

      deleteDeviceWires(device) {
        const toDel = wires.filter(w => (w.input && w.input.device === device) || (w.output && w.output.device === device));
        for (const w of toDel) this.removeWire(w);
      },

      deleteSelectedWires() {
        for (const w of [...selectedWires]) this.removeWire(w);
        selectedWires.length = 0;
      },

      selectWirePoint(p) {
        for (const wire of wires) {
          const wp = wire.getWirePoint(p);
          if (wp) {
            return { point: wp, wire, pointIndex: wire.wirePoints.indexOf(wp) };
          }
        }
        return null;
      },

      selectWirePoints(p) {
        selectedWirePoints.length = 0;
        let firstPoint = null;
        for (const wire of wires) {
          for (let i = 1; i < wire.wirePoints.length - 1; i++) {
            const pt = wire.wirePoints[i];
            if (dist(pt, p) <= WIREPOINT_HIT_RADIUS) {
              if (!firstPoint) {
                firstPoint = { point: pt, wire, pointIndex: i };
                selectedWirePoints.push(firstPoint);
                if (wire.wireKnot && samePt(wire.wireKnot, pt)) wire.wireKnot = null;
              } else if (samePt(pt, firstPoint.point)) {
                selectedWirePoints.push({ point: pt, wire, pointIndex: i });
                if (wire.wireKnot && samePt(wire.wireKnot, pt)) wire.wireKnot = null;
              }
            }
          }
        }
        return selectedWirePoints.length;
      },

      deselectWirePoints() {
        for (const wp of selectedWirePoints) {
          if (wp.wire && wp.wire.group) wp.wire.group.findKnots();
        }
        selectedWirePoints.length = 0;
      },

      moveSelectedPoints(p) {
        for (const wp of selectedWirePoints) {
          if (wp.pointIndex > 0 && wp.pointIndex < wp.wire.wirePoints.length - 1) {
            wp.wire.wirePoints[wp.pointIndex] = { x: Math.round(p.x), y: Math.round(p.y) };
          }
        }
      },

      wireHit(p) {
        for (const wire of wires) {
          if (wire.contains(p)) return wire;
        }
        return null;
      },

      wiresHit(p) {
        return wires.filter(w => w.contains(p) !== null);
      },

      selectWire(p) {
        selectedWires.length = 0;
        for (const wire of wires) {
          if (wire.contains(p)) selectedWires.push(wire);
        }
        return selectedWires.length;
      }
    };

    const wireCreator = {
      input: null,
      output: null,
      points: [],
      creatingWire: false,

      get needInput() { return this.input === null; },
      get needOutput() { return this.output === null; },
      get wireInput() { return this.input.offset; },
      get wireOutput() { return this.output.offset; },

      abort() {
        this.creatingWire = false;
        this.input = null;
        this.output = null;
        this.points.length = 0;
      },

      finish(reversePoints) {
        const pts = reversePoints ? [...this.points].reverse() : [...this.points];
        circuitWires.addWireFromMap({
          input: this.input.device.key,
          inputPin: this.input.id,
          output: this.output.device.key,
          outputPin: this.output.id,
          points: pts
        });
        this.abort();
      },

      createWire(p) {
        this.input = null;
        this.output = null;
        const hitIn = circuit.tryInputSelect(p);
        if (hitIn && !hitIn.connected) {
          this.input = hitIn;
          this.creatingWire = true;
          return true;
        }
        const hitOut = circuit.tryOutputSelect(p);
        if (hitOut) {
          this.output = hitOut;
          this.creatingWire = true;
          return true;
        }
        return false;
      },

      addWirePoint(p) {
        if (!this.creatingWire) return false;

        if (!this.input) {
          const hitIn = circuit.tryInputSelect(p);
          if (hitIn && !hitIn.connected) {
            this.input = hitIn;
            this.finish(true);
            return false;
          }
        }

        if (!this.output) {
          const hitOut = circuit.tryOutputSelect(p);
          if (hitOut) {
            this.output = hitOut;
            this.finish(false);
            return false;
          }

          const selectedPt = circuitWires.selectWirePoint(p);
          if (selectedPt) {
            this.output = selectedPt.wire.output;
            const endPts = selectedPt.wire.getWireEnd(selectedPt.point);
            for (const ep of endPts) this.points.push({ x: ep.x, y: ep.y });
            this.finish(false);
            return false;
          }

          const w = circuitWires.wireHit(p);
          if (w) {
            const sp = w.getWireSnapPoint(p);
            if (sp) {
              this.output = w.output;
              this.points.push({ x: sp.x, y: sp.y });
              let endWire = null;
              for (const wire of circuitWires.wiresHit(sp)) {
                const ws = wire.getSegment(sp);
                if (ws) endWire = wire.insertPoint(ws, sp);
              }
              if (endWire) {
                for (const ep of endWire) this.points.push({ x: ep.x, y: ep.y });
              }
              this.finish(false);
              return false;
            }
          }
        }

        if (circuit.tryDeviceSelect(p)) return false;
        this.points.push({ x: Math.round(p.x), y: Math.round(p.y) });
        return true;
      }
    };

    // =========================================================================
    // 9. PRESET CIRCUITS (Combining HappyLogicSimulator XML & XAndOrCode Presets)
    // =========================================================================
    // Helper to convert HappyLogicSimulator XML wire format (where points include start & end pin coordinates)
    function fromHappyXml(devices, xmlWires) {
      const convertedWires = xmlWires.map(w => {
        const [inDev, , inPinStr] = w.start.split('.');
        const [outDev, , outPinStr] = w.end.split('.');
        // Map HappyLogic's output pin ID (e.g. '3' on NOT/AND/NAND or '2'/'3' on TFF) to 0-indexed pin
        const devObj = devices.find(d => String(d.id) === String(outDev));
        const devType = devObj ? devObj.type.toLowerCase() : '';
        let outPin = Number(outPinStr);
        if (devType === 'tff') {
          outPin = outPin === 2 ? 0 : (outPin === 3 ? 1 : outPin);
        } else if (outPin >= 2 && ['and', 'nand', 'or', 'nor', 'xor', 'xnor', 'not', 'buffer'].includes(devType)) {
          outPin = 0;
        }
        let inPin = Number(inPinStr);
        if (devType === 'not' || (devices.find(d => String(d.id) === String(inDev))?.type.toLowerCase() === 'not')) {
          if (devices.find(d => String(d.id) === String(inDev))?.type.toLowerCase() === 'not') inPin = 0;
        }
        // HappyLogic's wirePoints include first (input offset) and last (output offset); strip those endpoints
        const mid = (w.points && w.points.length > 2) ? w.points.slice(1, w.points.length - 1) : [];
        const knotPt = (w.points || []).find(pt => pt.k);
        return {
          input: String(inDev),
          inputPin: inPin,
          output: String(outDev),
          outputPin: outPin,
          points: mid,
          knot: knotPt ? { x: knotPt.x, y: knotPt.y } : null
        };
      });
      return { devices, wires: convertedWires };
    }
