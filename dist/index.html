    // =========================================================================
    // 10. CIRCUIT CONTROLLER (lib/circuit.dart)
    // =========================================================================
    const circuit = {
      selectedInput: null,
      selectedOutput: null,
      selectedWirePoint: null,
      movingWirePoint: null,
      run: true,
      calculationTime: 0,
      tickCount: 0,

      clearCircuit() {
        logicDevices.length = 0;
        for (const k of Object.keys(logicDevicesMap)) delete logicDevicesMap[k];
        selectedDevices.length = 0;
        circuitWires.clearAll();
      },

      loadCircuit(name) {
        if (name) circuitName = name;
        const wasRunning = this.run;
        this.run = false;
        wireCreator.abort();
        contextMenu.hide();
        this.clearCircuit();

        let data = PRESET_CIRCUITS[circuitName];
        if (!data) {
          const saved = getSavedCircuits()[circuitName];
          if (saved) data = saved;
        }
        if (!data) data = PRESET_CIRCUITS.default;

        for (const d of (data.devices || [])) {
          const dev = this.newDeviceAt(d.type, String(d.id), { x: Number(d.x), y: Number(d.y) });
          if (dev) {
            if (d.label) dev.label = d.label;
            if (d.delay !== undefined) dev.setClock(d.delay, d.duration);
            if (d.state !== undefined) dev.setState(d.state);
            if (d.locked !== undefined) dev.locked = Boolean(d.locked);
          }
        }
        for (const w of (data.wires || [])) {
          circuitWires.addWireFromMap(w);
        }

        // Auto-scale CounterTest slightly so all 12 stages fit comfortably
        if (circuitName === 'CounterTest') {
          drawScale = Math.min(1.0, Math.max(0.65, (window.innerHeight - 60) / 730));
          updateZoomBadge();
        }

        this.run = wasRunning;
      },

      serializeCircuit() {
        return {
          name: circuitName,
          devices: logicDevices.map(d => ({
            id: d.key,
            type: d.deviceType.type,
            x: Math.round(d.position.x),
            y: Math.round(d.position.y),
            label: d.label || undefined,
            locked: d.locked || undefined,
            state: (d.deviceType.type === 'input' || d.deviceType.type === 'switch') ? d.outputs[0].value : undefined,
            ...(d.deviceType.type === 'clock' ? d.getClock() : {})
          })),
          wires: wires.map(w => w.toMap())
        };
      },

      newDeviceAt(type, id, position) {
        const dt = getDeviceType(type);
        if (!dt) return null;
        const dev = new LogicDevice(dt, id);
        logicDevices.push(dev);
        logicDevicesMap[String(id)] = dev;
        dev.moveDevice(position);
        return dev;
      },

      addLogicDevice(type, position) {
        const id = 'dev_' + (++nextIdCounter);
        const dev = this.newDeviceAt(type, id, position);
        if (dev) {
          selectedDevices.length = 0;
          selectedDevices.push(dev);
        }
        return dev;
      },

      tick() {
        const t0 = performance.now();
        this.tickCount++;
        for (const dev of logicDevices) dev.calculated = false;
        for (const dev of logicDevices) dev.calculate();
        const elapsedUs = (performance.now() - t0) * 1000;
        this.calculationTime = this.calculationTime * 0.9 + elapsedUs * 0.1;
      },

      keyDown(keyCode) {
        for (const dev of logicDevices) {
          if (dev.hasOutputMaps) dev.keyDown(keyCode);
        }
      },

      keyUp(keyCode) {
        for (const dev of logicDevices) {
          if (dev.hasOutputMaps) dev.keyUp(keyCode);
        }
      },

      tryDeviceSelect(p) {
        for (let i = logicDevices.length - 1; i >= 0; i--) {
          if (logicDevices[i].contains(p)) return logicDevices[i];
        }
        return null;
      },

      tryInputSelect(p) {
        for (const dev of logicDevices) {
          const hit = dev.InputPinHit(p);
          if (hit) return hit;
        }
        return null;
      },

      tryOutputSelect(p) {
        for (const dev of logicDevices) {
          const hit = dev.OutputPinHit(p);
          if (hit) return hit;
        }
        return null;
      },

      checkConnection(p) {
        this.selectedInput = null;
        this.selectedOutput = null;
        if (wireCreator.needInput) {
          const inp = this.tryInputSelect(p);
          this.selectedInput = inp;
          if (inp && !inp.connected) {
            uiPoint = { ...inp.offset };
            return true;
          }
        }
        if (wireCreator.needOutput) {
          const out = this.tryOutputSelect(p);
          this.selectedOutput = out;
          if (out) {
            uiPoint = { ...out.offset };
            return true;
          }
        }
        return false;
      },

      checkValid(p) {
        if (wireCreator.creatingWire) return this.checkConnection(p);
        this.selectedInput = this.tryInputSelect(p);
        if (this.selectedInput) return true;
        this.selectedOutput = this.tryOutputSelect(p);
        if (this.selectedOutput) return true;
        return false;
      },

      trySelectDevices(p) {
        selectedDevices.length = 0;
        for (let i = logicDevices.length - 1; i >= 0; i--) {
          if (logicDevices[i].contains(p)) {
            selectedDevices.push(logicDevices[i]);
            break;
          }
        }
        return selectedDevices.length > 0;
      },

      deleteDevice(d) {
        if (!d) return;
        circuitWires.deleteDeviceWires(d);
        const idx = logicDevices.indexOf(d);
        if (idx >= 0) logicDevices.splice(idx, 1);
        delete logicDevicesMap[d.key];
      },

      deleteSelectedDevices() {
        for (const d of [...selectedDevices]) this.deleteDevice(d);
        selectedDevices.length = 0;
      }
    };

    // =========================================================================
    // 11. CONTEXT MENU & RENDERER (lib/canvas_menu.dart, lib/circuit_draw.dart)
    // =========================================================================
    const contextMenu = {
      location: null,
      width: 145,
      height: 0,
      itemHeight: 26,
      items: [],
      selectedItem: null,
      device: null,

      get visible() { return this.location !== null; },
      hide() { this.location = null; },

      contains(p) {
        if (!this.location) return false;
        return p.x >= this.location.x && p.x <= this.location.x + this.width &&
               p.y >= this.location.y && p.y <= this.location.y + this.height;
      },

      selectItem(p) {
        if (!this.location) return null;
        const idx = Math.floor((p.y - this.location.y) / this.itemHeight);
        if (idx >= 0 && idx < this.items.length) this.selectedItem = this.items[idx];
        return this.selectedItem;
      },

      buildMenu(d) {
        if (!d) return;
        this.device = d;
        this.items = [
          d.locked ? 'Unlock Position' : 'Lock Position',
          'Edit Label',
          ...(d.deviceType.type === 'clock' ? ['Clock Timing...'] : []),
          ...(d.subLogic.length > 0 ? ['Inspect Sublogic'] : []),
          'Duplicate',
          'Delete'
        ];
        this.height = this.itemHeight * this.items.length;
        this.selectedItem = null;
      }
    };

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const bgImg = new Image();
    bgImg.src = resolveAssetUrl('images/GridBackground.png');
    let backgroundPattern = null;
    bgImg.onload = () => {
      backgroundPattern = context.createPattern(bgImg, 'repeat');
    };

    let moveDevice = null;
      let editLabelDevice = null;
    let deviceMoveOffset = { x: 0, y: 0 };
    let gridSnap = false;
    const gridSize = 10;

    function drawCircuit() {
      const width = canvas.width;
      const height = canvas.height;

      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.miterLimit = 10;
      context.clearRect(0, 0, width, height);

      // 1. Grid Background & Border
      context.save();
      context.scale(drawScale, drawScale);
      context.beginPath();
      context.fillStyle = backgroundPattern || '#eeeeee';
      context.lineWidth = 1;
      context.strokeStyle = '#d4d4d8';
      context.fillRect(0, 0, width / drawScale, height / drawScale);
      context.strokeRect(0, 0, width / drawScale, height / drawScale);
      context.closePath();
      context.restore();

      // 2. Selected Wires Highlight
      context.save();
      context.scale(drawScale, drawScale);
      context.strokeStyle = 'hsla(270, 100%, 60%, 0.75)';
      context.fillStyle = 'hsla(270, 100%, 60%, 0.75)';
      context.lineWidth = 10;
      for (const wire of selectedWires) drawSingleWire(wire);
      context.restore();

      // 3. All Wires & WireGroup Knots
      context.save();
      context.scale(drawScale, drawScale);
      context.lineWidth = 4;
      for (const wire of wires) {
        context.strokeStyle = wire.strokeStyle;
        context.fillStyle = wire.strokeStyle;
        drawSingleWire(wire);
      }
      context.restore();

      // 4. Selected Devices Shadow Glow (Green = movable, Red = locked)
      if (selectedDevices.length > 0) {
        context.save();
        context.scale(drawScale, drawScale);
        context.shadowBlur = 15;
        for (const device of selectedDevices) {
          context.shadowColor = device.locked ? '#ef4444' : '#00cc00';
          if (device.images.length > 0 && device.images[0].image.complete) {
            context.drawImage(
              device.images[0].image,
              device.position.x + device.images[0].offsetPoint.x,
              device.position.y + device.images[0].offsetPoint.y
            );
          }
        }
        context.restore();
      }

      // 5. All Devices & Labels
      context.save();
      context.scale(drawScale, drawScale);
      for (const device of logicDevices) {
        for (const img of device.images) {
          if (img.image.complete && img.image.naturalWidth > 0) {
            context.drawImage(
              img.image,
              device.position.x + img.offsetPoint.x,
              device.position.y + img.offsetPoint.y
            );
          }
        }
      }
      context.lineWidth = 1;
      context.fillStyle = '#000099';
      context.font = 'bold 12px Arial';
      for (const device of logicDevices) {
        if (device.label) {
          context.fillText(device.label, device.position.x, device.position.y - 6);
        }
      }
      // If adderTest is active, draw a live decimal summary banner on the canvas
      if (circuitName === 'adderTest') {
        drawAdderReadout();
      }
      context.restore();

      // 6. Active Wire Creator Preview
      if (wireCreator.creatingWire) {
        context.save();
        context.scale(drawScale, drawScale);
        context.beginPath();
        context.lineWidth = 4;
        context.strokeStyle = '#999999';
        if (wireCreator.input) {
          context.moveTo(wireCreator.wireInput.x, wireCreator.wireInput.y);
        } else if (wireCreator.output) {
          context.moveTo(wireCreator.wireOutput.x, wireCreator.wireOutput.y);
        }
        for (const pt of wireCreator.points) context.lineTo(pt.x, pt.y);
        context.lineTo(uiPoint.x, uiPoint.y);
        context.stroke();
        context.closePath();
        context.restore();
      }

      // 7. Pin Selectors & Connectable Pin Highlights
      context.save();
      context.scale(drawScale, drawScale);
      if (circuit.selectedOutput) {
        drawHighlightPin(circuit.selectedOutput.offset.x, circuit.selectedOutput.offset.y, 'VALID');
      }
      if (circuit.selectedInput) {
        drawHighlightPin(
          circuit.selectedInput.offset.x,
          circuit.selectedInput.offset.y,
          circuit.selectedInput.connected ? 'CONNECTED' : 'VALID'
        );
      }
      if (circuit.selectedWirePoint && circuit.selectedWirePoint.point) {
        drawHighlightPin(circuit.selectedWirePoint.point.x, circuit.selectedWirePoint.point.y, 'WIREPOINT');
      }
      if (wireCreator.creatingWire) {
        if (wireCreator.needInput) {
          for (const d of logicDevices) {
            for (const inp of d.inputs) {
              if (!inp.connected && inp.connectable) drawHighlightPin(inp.offset.x, inp.offset.y, 'CONNECTABLE');
            }
          }
        }
        if (wireCreator.needOutput) {
          for (const d of logicDevices) {
            for (const out of d.outputs) {
              if (out.connectable) drawHighlightPin(out.offset.x, out.offset.y, 'CONNECTABLE');
            }
          }
        }
      }
      context.restore();

      // 8. Inline Label Editor Box
      if (editLabelDevice) {
        context.save();
        context.scale(drawScale, drawScale);
        const txt = (editLabelDevice.label || '') + '_';
        context.font = 'bold 12px Arial';
        const tm = context.measureText(txt);
        const p = editLabelDevice.position;
        context.beginPath();
        context.shadowColor = '#303030';
        context.shadowOffsetX = 4;
        context.shadowOffsetY = 4;
        context.shadowBlur = 8;
        context.fillStyle = '#ffffff';
        context.strokeStyle = '#14005b';
        context.fillRect(p.x - 8, p.y - 24, tm.width + 24, 22);
        context.strokeRect(p.x - 8, p.y - 24, tm.width + 24, 22);
        context.closePath();
        context.shadowBlur = 0;
        context.fillStyle = 'DarkViolet';
        context.fillText(txt, p.x, p.y - 9);
        context.restore();
      }

      // 9. Right-Click Context Menu
      if (contextMenu.visible) {
        drawContextMenu(contextMenu);
      }
    }

    function drawAdderReadout() {
      const bitVal = id => (logicDevicesMap[id] && logicDevicesMap[id].outputs[0]?.value) ? 1 : 0;
      const a = bitVal('a0') + (bitVal('a1') << 1) + (bitVal('a2') << 2) + (bitVal('a3') << 3);
      const b = bitVal('b0') + (bitVal('b1') << 1) + (bitVal('b2') << 2) + (bitVal('b3') << 3);
      const cin = bitVal('cin');
      const s0 = bitVal('s0'), s1 = bitVal('s1'), s2 = bitVal('s2'), s3 = bitVal('s3'), cout = bitVal('cout');
      const total = s0 + (s1 << 1) + (s2 << 2) + (s3 << 3) + (cout << 4);
      context.save();
      context.fillStyle = 'rgba(20, 0, 91, 0.9)';
      context.fillRect(420, 175, 265, 58);
      context.fillStyle = '#f3ee00';
      context.font = 'bold 13px monospace';
      context.fillText(`A = ${a} (${a.toString(2).padStart(4, '0')})   B = ${b} (${b.toString(2).padStart(4, '0')})`, 432, 198);
      context.fillStyle = '#00fc00';
      context.fillText(`A + B + Cin(${cin}) = ${total} (${total.toString(2).padStart(5, '0')})`, 432, 220);
      context.restore();
    }

    function drawSingleWire(wire) {
      if (!wire.input || !wire.output || wire.wirePoints.length === 0) return;
      context.beginPath();
      context.moveTo(wire.input.offset.x, wire.input.offset.y);
      for (let i = 1; i < wire.wirePoints.length - 1; i++) {
        context.lineTo(wire.wirePoints[i].x, wire.wirePoints[i].y);
      }
      context.lineTo(wire.output.offset.x, wire.output.offset.y);
      context.stroke();
      context.closePath();

      if (wire.wireKnot) {
        context.beginPath();
        context.arc(wire.wireKnot.x, wire.wireKnot.y, 5, 0, Math.PI * 2, false);
        context.fill();
        context.stroke();
        context.closePath();
      }
    }

    function drawHighlightPin(x, y, mode) {
      switch (mode) {
        case 'VALID':
          context.strokeStyle = '#00AA00';
          context.fillStyle = 'rgba(0, 170, 0, 0.25)';
          break;
        case 'CONNECTED':
          context.strokeStyle = '#FFFF00';
          context.fillStyle = 'rgba(0, 170, 0, 0.5)';
          break;
        case 'WIREPOINT':
          context.strokeStyle = 'hsla(240, 100%, 50%, 1)';
          context.fillStyle = 'hsla(240, 100%, 50%, 0.25)';
          break;
        case 'CONNECTABLE':
          context.strokeStyle = 'hsla(270, 75%, 50%, 1)';
          context.fillStyle = 'hsla(270, 75%, 50%, 0.25)';
          break;
        default:
          context.strokeStyle = '#000000';
          context.fillStyle = 'rgba(255, 0, 0, 0.5)';
      }
      context.beginPath();
      context.lineWidth = 1.5;
      context.arc(x, y, 8.1, 0, Math.PI * 2, false);
      context.fill();
      context.stroke();
      context.closePath();
    }

    function drawContextMenu(menu) {
      if (!menu.location) return;
      context.save();
      context.scale(drawScale, drawScale);
      context.beginPath();
      context.shadowBlur = 16;
      context.shadowColor = 'rgba(0,0,0,0.35)';
      context.fillStyle = '#f8fafc';
      context.strokeStyle = '#1e293b';
      context.lineWidth = 1;
      context.fillRect(menu.location.x, menu.location.y, menu.width, menu.height);
      context.strokeRect(menu.location.x, menu.location.y, menu.width, menu.height);
      context.closePath();
      context.shadowBlur = 0;
      context.font = '12px Inter, Arial, sans-serif';

      for (let t = 0; t < menu.items.length; t++) {
        const y = menu.location.y + t * menu.itemHeight;
        if (menu.items[t] === menu.selectedItem) {
          context.fillStyle = '#2c009d';
          context.fillRect(menu.location.x + 1, y + 1, menu.width - 2, menu.itemHeight - 2);
          context.fillStyle = '#f3ee00';
        } else {
          context.fillStyle = '#0f172a';
        }
        context.fillText(menu.items[t], menu.location.x + 10, y + 17);
      }
      context.restore();
    }

    // =========================================================================
    // 12. SIDEBAR PALETTE & INTERACTION HANDLERS (lib/sidebar.dart, lib/circuit_view.dart)
    // =========================================================================
    function renderSidebarPalette() {
      const container = document.getElementById('palette_container');
      container.innerHTML = '';
      const categories = {};
      for (const dt of deviceTypesList) {
        if (!categories[dt.category]) categories[dt.category] = [];
        categories[dt.category].push(dt);
      }
      for (const [catName, list] of Object.entries(categories)) {
        const sec = document.createElement('div');
        sec.className = 'flex flex-col gap-1';
        const header = document.createElement('div');
        header.className = 'text-xs font-semibold text-slate-600 px-1 pt-1 border-t border-slate-300 first:border-t-0';
        header.textContent = catName;
        sec.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-1.5';
        for (const dt of list) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'palette-item bg-white hover:bg-indigo-50 border border-slate-300 hover:border-[#2c009d] rounded-lg p-1.5 flex flex-col items-center justify-center gap-1 shadow-sm cursor-pointer';
          card.title = `Add ${dt.displayName} (${dt.type.toUpperCase()})`;
          const img = document.createElement('img');
          img.src = (dt.iconImage && dt.iconImage.image.src) || (dt.baseImage && dt.baseImage.image.src) || '';
          img.alt = dt.displayName;
          const lbl = document.createElement('span');
          lbl.className = 'text-xs font-medium text-slate-800 truncate w-full text-center leading-tight';
          lbl.textContent = dt.type.toUpperCase();
          card.appendChild(img);
          card.appendChild(lbl);

          card.addEventListener('click', () => {
            const spawnPos = {
              x: Math.round((160 + (logicDevices.length % 5) * 35) / drawScale),
              y: Math.round((90 + (logicDevices.length % 6) * 35) / drawScale)
            };
            const newDev = circuit.addLogicDevice(dt.type, spawnPos);
            if (newDev) {
              moveDevice = newDev;
              deviceMoveOffset = dt.centerPoint;
            }
          });
          grid.appendChild(card);
        }
        sec.appendChild(grid);
        container.appendChild(sec);
      }
    }

    function updateUiPointFromMouse(e) {
      const rect = canvas.getBoundingClientRect();
      const ox = e.clientX - rect.left;
      const oy = e.clientY - rect.top;
      if (gridSnap) {
        const gx = Math.floor(ox / gridSize) * gridSize;
        const gy = Math.floor(oy / gridSize) * gridSize;
        uiPoint = { x: gx / drawScale, y: gy / drawScale };
        uiPointUnscaled = { x: gx, y: gy };
      } else {
        uiPoint = { x: ox / drawScale, y: oy / drawScale };
        uiPointUnscaled = { x: ox, y: oy };
      }
    }

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('mousedown', e => {
      e.preventDefault();
      updateUiPointFromMouse(e);

      if (e.button === 0) {
        if (contextMenu.visible) {
          if (contextMenu.contains(uiPoint)) {
            const choice = contextMenu.selectItem(uiPoint);
            const targetDev = contextMenu.device;
            contextMenu.hide();
            handleContextMenuAction(choice, targetDev);
          } else {
            contextMenu.hide();
          }
          return;
        }

        if (editLabelDevice) {
          editLabelDevice = null;
        }

        if (wireCreator.creatingWire) {
          wireCreator.addWirePoint(uiPoint);
          return;
        } else if (wireCreator.createWire(uiPoint)) {
          return;
        }

        if (moveDevice) {
          moveDevice = null;
          return;
        }

        if (circuit.trySelectDevices(uiPoint)) {
          const topDev = selectedDevices[0];
          topDev.clicked(uiPoint);
          if (topDev.locked) return;
          moveDevice = topDev;
          deviceMoveOffset = {
            x: topDev.position.x - uiPoint.x,
            y: topDev.position.y - uiPoint.y
          };
          return;
        }

        if (circuitWires.selectWirePoints(uiPoint) > 0) return;
        if (circuitWires.selectWire(uiPoint) > 0) return;
        selectedWires.length = 0;
      } else if (e.button === 2) {
        if (wireCreator.creatingWire) {
          wireCreator.abort();
          return;
        }
        if (contextMenu.visible) {
          contextMenu.hide();
        } else if (circuit.trySelectDevices(uiPoint)) {
          contextMenu.buildMenu(selectedDevices[0]);
          contextMenu.location = { ...uiPoint };
        }
      }
    });

    canvas.addEventListener('mousemove', e => {
      updateUiPointFromMouse(e);

      if (selectedWirePoints.length > 0) {
        circuitWires.moveSelectedPoints(uiPoint);
        return;
      }

      if (contextMenu.visible) {
        if (contextMenu.contains(uiPoint)) contextMenu.selectItem(uiPoint);
        return;
      }

      if (moveDevice) {
        if (gridSnap) {
          const nx = Math.round((uiPoint.x + deviceMoveOffset.x) / gridSize) * gridSize;
          const ny = Math.round((uiPoint.y + deviceMoveOffset.y) / gridSize) * gridSize;
          moveDevice.moveDevice({ x: nx, y: ny });
        } else {
          moveDevice.moveDevice({
            x: uiPoint.x + deviceMoveOffset.x,
            y: uiPoint.y + deviceMoveOffset.y
          });
        }
        return;
      }

      if (wireCreator.creatingWire) {
        if (circuit.checkConnection(uiPoint)) return;
        if (wireCreator.needOutput) {
          circuit.selectedWirePoint = circuitWires.selectWirePoint(uiPoint);
          if (circuit.selectedWirePoint) {
            uiPoint = { ...circuit.selectedWirePoint.point };
          } else {
            const hitW = circuitWires.wireHit(uiPoint);
            if (hitW) {
              const sp = hitW.getWireSnapPoint(uiPoint);
              if (sp) uiPoint = sp;
            }
          }
          return;
        }
      }

      if (circuit.checkValid(uiPoint)) return;
      circuit.selectedWirePoint = circuitWires.selectWirePoint(uiPoint);
      if (circuit.selectedWirePoint) return;
      circuit.trySelectDevices(uiPoint);
    });

    canvas.addEventListener('mouseup', e => {
      e.preventDefault();
      if (moveDevice) moveDevice = null;
      if (selectedWirePoints.length > 0) circuitWires.deselectWirePoints();
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      drawScale = Math.min(2.5, Math.max(0.35, drawScale - e.deltaY / 1000));
      updateZoomBadge();
    }, { passive: false });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('modal_overlay').classList.contains('hidden')) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

      if (editLabelDevice) {
        e.preventDefault();
        if (e.key === 'Enter' || e.key === 'Escape') {
          editLabelDevice = null;
        } else if (e.key === 'Backspace') {
          editLabelDevice.label = (editLabelDevice.label || '').slice(0, -1);
        } else if (e.key === 'Delete') {
          editLabelDevice.label = '';
          editLabelDevice = null;
        } else if (e.key.length === 1) {
          editLabelDevice.label = (editLabelDevice.label || '') + e.key;
        }
        return;
      }

      if ([32, 37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
      circuit.keyDown(e.keyCode);
    });

    document.addEventListener('keyup', e => {
      if (!document.getElementById('modal_overlay').classList.contains('hidden')) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (editLabelDevice) return;

      circuit.keyUp(e.keyCode);

      if (e.key === 'Escape' && wireCreator.creatingWire) {
        wireCreator.abort();
        return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (wireCreator.creatingWire) {
          wireCreator.abort();
          return;
        }
        if (selectedWires.length > 0) {
          circuitWires.deleteSelectedWires();
          return;
        }
        if (selectedDevices.length > 0) {
          circuit.deleteSelectedDevices();
        }
      }
    });

    // =========================================================================
    // 13. CONTEXT MENU ACTIONS, MODALS, & CUSTOM IC CHIP CREATION
    // =========================================================================
    function handleContextMenuAction(choice, dev) {
      if (!dev || !choice) return;
      if (choice.startsWith('Lock') || choice.startsWith('Unlock')) {
        dev.locked = !dev.locked;
      } else if (choice === 'Edit Label') {
        editLabelDevice = dev;
        if (!dev.label) dev.label = '';
      } else if (choice === 'Clock Timing...') {
        const cur = dev.getClock();
        openModal(
          `Clock Timing — ${dev.label || dev.key}`,
          `<div class="space-y-3">
            <p>Configure low/high tick durations (1 tick = 10 ms at 100 Hz):</p>
            <div class="grid grid-cols-2 gap-3">
              <label class="block">
                <span class="font-semibold block mb-1">Low Delay (ticks)</span>
                <input id="inp_clk_delay" type="number" min="5" max="500" value="${cur.delay}" class="w-full border border-slate-300 rounded px-2 py-1.5" />
              </label>
              <label class="block">
                <span class="font-semibold block mb-1">High Duration (ticks)</span>
                <input id="inp_clk_dur" type="number" min="5" max="500" value="${cur.duration}" class="w-full border border-slate-300 rounded px-2 py-1.5" />
              </label>
            </div>
          </div>`,
          [
            {
              label: 'Apply Timing',
              primary: true,
              onClick: () => {
                const d = Number(document.getElementById('inp_clk_delay').value);
                const dur = Number(document.getElementById('inp_clk_dur').value);
                dev.setClock(d, dur);
                closeModal();
              }
            }
          ]
        );
      } else if (choice === 'Inspect Sublogic') {
        const rows = dev.subLogic.map((g, idx) => {
          const c1 = g.ig1 >= 0 ? `Gate #${g.ig1}` : '—';
          const c2 = g.ig2 >= 0 ? `Gate #${g.ig2}` : '—';
          const stateBadge = g.out
            ? '<span class="px-1.5 py-0.5 rounded bg-red-100 text-red-700 font-bold">HIGH (1)</span>'
            : '<span class="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">LOW (0)</span>';
          return `<tr class="border-b border-slate-100">
            <td class="py-1 px-2 font-mono">#${idx}</td>
            <td class="py-1 px-2 font-bold uppercase text-[#2c009d]">${g.name}</td>
            <td class="py-1 px-2 font-mono">${c1}</td>
            <td class="py-1 px-2 font-mono">${c2}</td>
            <td class="py-1 px-2">${stateBadge}</td>
          </tr>`;
        }).join('');
        openModal(
          `Internal Sublogic Netlist — ${dev.deviceType.displayName} (${dev.subLogic.length} primitive gates)`,
          `<p class="text-slate-600 mb-2">Every composite device in HappyLogic × XAndOrCode is simulated in real time using 2-input primitive gates with ${OUTPUT_DELAY}-tick propagation delay:</p>
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-300">
                <th class="py-1.5 px-2">Gate</th>
                <th class="py-1.5 px-2">Primitive</th>
                <th class="py-1.5 px-2">In 1</th>
                <th class="py-1.5 px-2">In 2</th>
                <th class="py-1.5 px-2">Live Output</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`,
          [{ label: 'Close', primary: true, onClick: closeModal }]
        );
      } else if (choice === 'Duplicate') {
        const copy = circuit.addLogicDevice(dev.deviceType.type, {
          x: dev.position.x + 30,
          y: dev.position.y + 30
        });
        if (copy && dev.label) copy.label = dev.label + ' copy';
      } else if (choice === 'Delete') {
        circuit.deleteDevice(dev);
      }
    }

    function openModal(title, bodyHtml, buttons = []) {
      document.getElementById('modal_title').textContent = title;
      document.getElementById('modal_body').innerHTML = bodyHtml;
      const footer = document.getElementById('modal_footer');
      footer.innerHTML = '';
      for (const b of buttons) {
        const btn = document.createElement('button');
        btn.className = b.primary
          ? 'bg-[#2c009d] hover:bg-[#4f4cff] text-[#f3ee00] text-xs font-semibold px-3 py-1.5 rounded cursor-pointer'
          : 'bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-medium px-3 py-1.5 rounded cursor-pointer';
        btn.textContent = b.label;
        btn.addEventListener('click', b.onClick);
        footer.appendChild(btn);
      }
      document.getElementById('modal_overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal_overlay').classList.add('hidden');
    }
    document.getElementById('modal_close').addEventListener('click', closeModal);

    // LocalStorage Saved Circuits
    const STORAGE_KEY = 'happy_xandor_saved_circuits_v1';
    function getSavedCircuits() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }
    function refreshSavedCircuitsDropdown() {
      const optgroup = document.getElementById('user_circuits_optgroup');
      optgroup.innerHTML = '';
      const saved = getSavedCircuits();
      for (const name of Object.keys(saved)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${name} (Saved)`;
        optgroup.appendChild(opt);
      }
    }

    // Toolbar Wire-up
    document.getElementById('select_circuit').addEventListener('change', e => {
      circuit.loadCircuit(e.target.value);
    });

    document.getElementById('btn_run_pause').addEventListener('click', () => {
      circuit.run = !circuit.run;
      document.getElementById('run_pause_label').textContent = circuit.run ? 'Pause' : 'Run';
      const ind = document.getElementById('sim-indicator');
      ind.className = circuit.run
        ? 'inline-block w-2.5 h-2.5 rounded-full bg-[#00fc00] shadow-[0_0_8px_#00fc00]'
        : 'inline-block w-2.5 h-2.5 rounded-full bg-amber-400';
    });

    document.getElementById('btn_step').addEventListener('click', () => {
      circuit.run = false;
      document.getElementById('run_pause_label').textContent = 'Run';
      document.getElementById('sim-indicator').className = 'inline-block w-2.5 h-2.5 rounded-full bg-amber-400';
      circuit.tick();
      drawCircuit();
    });

    document.getElementById('checkbox_gridsnap').addEventListener('change', e => {
      gridSnap = e.target.checked;
    });

    function updateZoomBadge() {
      document.getElementById('button_zoomReset').textContent = `${Math.round(drawScale * 100)}%`;
    }
    document.getElementById('button_zoomIn').addEventListener('click', () => {
      drawScale = Math.min(2.5, drawScale + 0.1);
      updateZoomBadge();
    });
    document.getElementById('button_zoomOut').addEventListener('click', () => {
      drawScale = Math.max(0.35, drawScale - 0.1);
      updateZoomBadge();
    });
    document.getElementById('button_zoomReset').addEventListener('click', () => {
      drawScale = 1.0;
      updateZoomBadge();
    });

    document.getElementById('btn_clear').addEventListener('click', () => {
      circuit.clearCircuit();
    });

    document.getElementById('btn_save_circuit').addEventListener('click', () => {
      openModal(
        'Save Circuit to Browser Storage',
        `<label class="block space-y-1">
          <span class="font-semibold">Circuit Name:</span>
          <input id="inp_save_circuit_name" type="text" value="${circuitName}" class="w-full border border-slate-300 rounded px-2.5 py-1.5" placeholder="e.g. my_alu_circuit" />
        </label>`,
        [
          { label: 'Cancel', primary: false, onClick: closeModal },
          {
            label: 'Save Circuit',
            primary: true,
            onClick: () => {
              const name = (document.getElementById('inp_save_circuit_name').value || '').trim() || 'custom_circuit';
              circuitName = name;
              const all = getSavedCircuits();
              all[name] = circuit.serializeCircuit();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
              refreshSavedCircuitsDropdown();
              document.getElementById('select_circuit').value = name;
              closeModal();
            }
          }
        ]
      );
    });

    // Combine HappyLogicSimulator's saveAsDevice & XAndOrCode's LogicDeviceTypes.createDevice!
    document.getElementById('btn_save_device').addEventListener('click', () => {
      const inputDevs = logicDevices.filter(d => d.deviceType.type === 'input' || d.deviceType.type === 'switch');
      const outputDevs = logicDevices.filter(d => d.deviceType.type === 'output' || d.deviceType.type === 'binary');
      openModal(
        'Create Custom IC Chip from Current Circuit',
        `<div class="space-y-2">
          <p>Compiles the current canvas circuit (${inputDevs.length} inputs, ${outputDevs.length} outputs, ${logicDevices.length} total devices) into a reusable composite device in the sidebar palette.</p>
          <label class="block space-y-1">
            <span class="font-semibold">New Device Name (2–8 chars):</span>
            <input id="inp_new_chip_name" type="text" value="CHIP1" maxlength="10" class="w-full border border-slate-300 rounded px-2.5 py-1.5 font-mono uppercase" />
          </label>
        </div>`,
        [
          { label: 'Cancel', primary: false, onClick: closeModal },
          {
            label: 'Create IC Chip',
            primary: true,
            onClick: () => {
              const rawName = (document.getElementById('inp_new_chip_name').value || 'CHIP').trim().toLowerCase();
              createCustomDeviceFromCircuit(rawName);
              closeModal();
            }
          }
        ]
      );
    });

    function createCustomDeviceFromCircuit(chipName) {
      if (logicDevices.length === 0) return;
      const dt = addNewType(chipName, 'Custom ICs', chipName.toUpperCase());
      dt.setBaseImage('images/125dpi/fadder.png');
      dt.setIconImage('images/125dpi/fadder.png');
      dt.subLogicGates.length = 0;

      // Sort inputs & outputs top-to-bottom by Y coordinate
      const inDevs = logicDevices.filter(d => d.deviceType.type === 'input' || d.deviceType.type === 'switch')
        .sort((a, b) => a.position.y - b.position.y);
      const outDevs = logicDevices.filter(d => d.deviceType.type === 'output' || d.deviceType.type === 'binary')
        .sort((a, b) => a.position.y - b.position.y);

      inDevs.forEach((d, idx) => {
        const y = Math.round(15 + (idx * 58) / Math.max(1, inDevs.length - 1 || 1));
        dt.addInput(idx, 2, inDevs.length === 1 ? 44 : y, d.label || `IN${idx}`);
      });
      outDevs.forEach((d, idx) => {
        const y = Math.round(15 + (idx * 58) / Math.max(1, outDevs.length - 1 || 1));
        dt.addOutput(idx, 93, outDevs.length === 1 ? 44 : y, d.label || `OUT${idx}`);
      });

      // Flatten primitive gates into the custom IC's sublogic netlist
      let inIdx = 0;
      let outIdx = 0;
      for (const d of logicDevices) {
        const t = d.deviceType.type;
        const c1 = d.inputs[0]?.connectedWire ? logicDevices.indexOf(d.inputs[0].connectedWire.output.device) : -1;
        const c2 = d.inputs[1]?.connectedWire ? logicDevices.indexOf(d.inputs[1].connectedWire.output.device) : -1;
        if (t === 'input' || t === 'switch') {
          dt.addSubLogicGate('input', -1, inIdx++);
        } else if (t === 'output' || t === 'binary') {
          dt.addSubLogicGate('output', c1, outIdx++);
        } else {
          dt.addSubLogicGate(t, c1, t === 'not' ? c1 : c2);
        }
      }
      renderSidebarPalette();
    }

    document.getElementById('btn_export_json').addEventListener('click', () => {
      const jsonStr = JSON.stringify(circuit.serializeCircuit(), null, 2);
      openModal(
        'Export / Import Circuit JSON',
        `<p class="text-slate-600">Copy this JSON or paste a circuit JSON payload below and click <b>Load JSON</b>:</p>
        <textarea id="txt_circuit_json" rows="10" class="w-full font-mono text-xs border border-slate-300 rounded p-2">${jsonStr}</textarea>`,
        [
          { label: 'Close', primary: false, onClick: closeModal },
          {
            label: 'Load JSON',
            primary: true,
            onClick: () => {
              try {
                const parsed = JSON.parse(document.getElementById('txt_circuit_json').value);
                const name = parsed.name || 'imported';
                PRESET_CIRCUITS[name] = parsed;
                circuit.loadCircuit(name);
                closeModal();
              } catch (err) {
                alert('Invalid JSON: ' + err.message);
              }
            }
          }
        ]
      );
    });

    // =========================================================================
    // 14. RESIZE, 100Hz SIMULATION TIMER, & ANIMATION LOOP
    // =========================================================================
    function onResize() {
      const wrap = document.getElementById('canvas-wrap');
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      drawCircuit();
    }
    window.addEventListener('resize', onResize);

    // 100 Hz Logic Simulation Loop (10 ms period, matching Circuit.afterDeviceTypesLoaded)
    setInterval(() => {
      if (circuit.run) circuit.tick();
    }, 10);

    // Telemetry badge updater
    setInterval(() => {
      document.getElementById('stat_calc').textContent = `${circuit.calculationTime.toFixed(1)} μs/tick`;
      document.getElementById('stat_wire').textContent = `${logicDevices.length} dev · ${wires.length} wire`;
    }, 400);

    function animate() {
      drawCircuit();
      requestAnimationFrame(animate);
    }

    // Boot Simulator
    registerBuiltInDeviceTypes();
    refreshSavedCircuitsDropdown();
    renderSidebarPalette();
    onResize();
    circuit.loadCircuit('default');
    requestAnimationFrame(animate);
  </script>
</body>
</html>
